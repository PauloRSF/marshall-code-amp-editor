[package]
name = "code_editor"
version = "0.1.0"
edition = "2021"
description = "Native Marshall CODE amp preset editor"
license = "MIT"
authors = ["CODE Editor"]
readme = "README.md"
repository = "https://github.com/PauloRSF/marshall-code-amp-editor"
autobins = false

[[bin]]
name = "MarshallCodeEditor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = true, features = ["wgpu", "default_fonts"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
midir = "0.11"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
